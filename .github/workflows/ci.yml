name: Continuous integration

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test and build Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build mingw-w64

      - name: Run Linux unit tests
        shell: bash
        run: ./scripts/test-linux.sh

      - name: Build Windows release
        shell: bash
        run: ./scripts/build-windows.sh
